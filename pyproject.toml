[project]
name = "omop-utils"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "meds==0.3.3",
    "mssql-python>=1.15.0",
    "polars>=1.30,<2",
    "pyarrow>=25.0.1",
]

[project.scripts]
omop-utils = "omop_utils.__main__:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.4",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
